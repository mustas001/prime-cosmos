<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Prime numbers as a GPU-driven constellation: morph between Ulam, Sacks, phyllotaxis and more, from 1 to 10 million." />
    <title>Prime Cosmos</title>
    <!-- Inline so the browser never requests /favicon.ico (a 404 on a GitHub Pages project site). -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2303040a'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23ef4444' opacity='.25'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ef4444'/%3E%3C/svg%3E"
    />
  </head>
  <body class="bg-[#03040a] text-zinc-200 antialiased">
    <!-- WebGL canvas + camera input -->
    <div id="app" class="fixed inset-0"></div>
    <!-- HUD overlay (pointer-events pass through to #app except on its own cards) -->
    <div id="hud" class="fixed inset-0 pointer-events-none"></div>
    <!-- Tweakpane -->
    <div id="panel" class="fixed right-3 top-3 z-10 max-h-[calc(100vh-1.5rem)] w-[17.5rem] overflow-y-auto overflow-x-hidden rounded-xl sm:right-5 sm:top-5"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
